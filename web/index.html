<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Drone joystick</title>
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="panels">
    <img id="video" alt="sim camera feed">
    <div id="mapwrap">
      <div id="map"></div>
      <div id="mapbar">
        <label>alt <input id="m-alt" type="number" step="1" value="5"></label>
        <button id="m-fly" disabled>FLY</button>
        <button id="m-pause" disabled>PAUSE</button>
        <button id="m-clear" disabled>CLEAR</button>
      </div>
      <div id="mstat">click the map to add waypoints</div>
    </div>
  </div>
  <div id="telem">
    <span>link <b id="t-link" class="bad">--</b></span>
    <span>mode <b id="t-mode">--</b></span>
    <span>armed <b id="t-armed">--</b></span>
    <span>alt <b id="t-alt">--</b> m</span>
    <span>hdg <b id="t-hdg">--</b>&deg;</span>
    <span>speed <b id="t-gs">--</b>/<b id="t-cmd">--</b> m/s</span>
    <span>sim <b id="t-sim">--</b></span>
  </div>
  <!-- GPS-denied flight. Hidden unless joystick-server.py was started with
       --vision, so an ordinary GPS flight shows no dead row. -->
  <div id="telem-vio" hidden>
    <span>vio <b id="t-vio" class="bad">--</b></span>
    <span>drift <b id="t-vio-drift">--</b> m</span>
    <span>pts <b id="t-vio-pts">--</b></span>
    <span>fix <b id="t-vio-fps">--</b> Hz</span>
    <!-- How far the last phase transition had to shift the vision frame to
         meet PX4's. This is the error EKF2 would otherwise have inherited. -->
    <span>align <b id="t-vio-align">--</b> m</span>
  </div>
  <div id="controls">
    <div>
      <div id="pad">
        <span></span>
        <button data-dir="fwd"><span class="g">&#9650;</span><span class="t">FWD</span></button>
        <span></span>
        <button data-dir="yaw_left"><span class="g">&#8634;</span><span class="t">TURN L</span></button>
        <span></span>
        <button data-dir="yaw_right"><span class="g">&#8635;</span><span class="t">TURN R</span></button>
        <span></span>
        <button data-dir="back"><span class="g">&#9660;</span><span class="t">BACK</span></button>
        <span></span>
      </div>
      <div class="cap">move &amp; turn</div>
    </div>
    <div>
      <div id="alt">
        <button data-dir="up"><span class="g">&#9650;</span><span class="t">ASCEND</span></button>
        <button data-dir="down"><span class="g">&#9660;</span><span class="t">DESCEND</span></button>
      </div>
      <div class="cap">altitude</div>
    </div>
  </div>
  <div id="cmds">
    <button id="c-arm">ARM</button>
    <button id="c-takeoff">TAKEOFF</button>
    <button id="c-offboard">OFFBOARD</button>
    <button id="c-land">LAND</button>
    <button id="c-disarm">DISARM</button>
  </div>
  <!-- Hidden unless the server was started with --vision. Cutting GNSS is a
       deliberate act taken at altitude with a healthy VIO row, never a default,
       so it gets its own control rather than a place in the command row. -->
  <div id="gpsd" hidden>
    <button id="c-gps_denied">GO GPS-DENIED</button>
    <!-- The abort. Shown only once GNSS is actually cut, because that is the
         only time it does anything, and it must be reachable without a shell
         on the box while the aircraft is drifting away. -->
    <button id="c-gps_restore" hidden>RESTORE GNSS</button>
    <span id="gpsd-stat">GNSS on — climb until VIO is healthy</span>
  </div>
  <div id="rec">
    <button id="c-record" disabled>RECORD</button>
    <span id="rec-dot"></span>
    <span id="rec-stat">recorder offline</span>
  </div>
  <div id="status"></div>
<script src="/vendor/leaflet.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
